title: Gaël Gendron
description: >-
  Senior machine learning research scientist at LawZero, building safe-by-design AI
  by disentangling predictive capability from agency.
author: Gaël Gendron
url: "https://ggendro.github.io"
baseurl: ""

# Build settings
markdown: kramdown
theme: null # layouts are self-contained; null stops GitHub Pages defaulting to jekyll-theme-primer
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap # also generates robots.txt
  - jekyll-redirect-from # old /about.html and /projects/... URLs redirect to the home page (see index.html)
kramdown:
  parse_block_html: true
redirect_from:
  json: false # don't publish /redirects.json

# Structured data (JSON-LD) for jekyll-seo-tag; keep in sync with social links in _data/profile.yml
social:
  name: Gaël Gendron
  links:
    - https://www.linkedin.com/in/gael-gendron/
    - https://github.com/ggendro
    - https://scholar.google.com/citations?user=ZW1IdHEAAAAJ

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      # Link-preview image (Open Graph / Twitter); square photo, hence the "summary" card
      image:
        path: /assets/profile.jpeg
        alt: Picture of Gaël Gendron
      twitter:
        card: summary
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  
# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - .git
  - .gitignore
  - .bundle
  - docker-compose.yml
  - LICENSE
  - _posts/2020-01-01-post-example.md
  - env