- title: "Safety from Honesty in a Disinterested AI Predictor"
  url: https://arxiv.org/abs/2606.29657
  tldr: "A formal safety argument for the Scientist AI: a predictor trained to approximate a Bayesian posterior, never rewarded for the consequences of its predictions, is unlikely, under stated assumptions, to cause harm through coordinated deception."
  authors: [Yoshua Bengio, Oliver Richardson, Tomáš Gavenčiak, Michael Cohen, Rory Svarc, Damiano Fornasiere, Gaël Gendron, David Hyland, Aton Kamanda, Adam Oberman, Francis Rhys Ward, Anna Gavenčiak, Jacob Livingston Slosser, Vincent Mai, Iulian Serban, Joumana Ghosn]
  venue: Preprint 2026
  year: 2026

- title: "The Scientist AI: Safe by Design, by Not Desiring"
  url: https://lawzero.org/en/publication/scientist-ai-safe-design-not-desiring
  tldr: "A design for AI that is highly capable yet holds no goals of its own by construction: limit affordances and goal-directedness, attribute claims to their sources, and withhold feedback on downstream outcomes."
  authors: [Damiano Fornasiere, Oliver Richardson, Gaël Gendron, Iulian Serban, Yoshua Bengio]
  venue: Preprint 2026
  year: 2026

- title: "Causal Cartographer: From Mapping to Reasoning Over Counterfactual Worlds"
  url: https://arxiv.org/abs/2505.14396
  tldr: "LLM agents that extract causal knowledge from text into a causal graph (CausalWorld), then reason step by step over counterfactual worlds, with competitive accuracy and up to 70% lower inference cost than chain-of-thought."
  authors: [Gaël Gendron, Jože M. Rožanec, Michael Witbrock, Gillian Dobbie]
  venue: ICML 2026 Workshop
  venue_full: 2nd Workshop on Compositional Learning @ ICML 2026
  year: 2026
  code: https://github.com/ggendro/causal-cartographer

