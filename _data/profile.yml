# Bio (hero of the home page)
short_bio: |-
  I am Gaël *(pron. [gah-el])*, senior machine learning research scientist at [LawZero](https://lawzero.org/en/research), an AI safety nonprofit organization created by Yoshua Bengio and incubated at Mila - Quebec AI Institute.
  I work on the [Scientist AI](https://lawzero.org/en/publication/scientist-ai-safe-design-not-desiring), an approach to building safer frontier models by disentangling predictive capability from agency. My interests include pre-training alignment, prospective monitoring, world modelling and scalable oversight.

  Before joining LawZero, I completed my Ph.D. at the University of Auckland on deep causal modelling for reasoning and generalization.
  My background is in causal reasoning, which I see as crucial for creating safe and reliable frontier models that better understand the world and are more aligned as capability increases.

# Research section: short arc shown above the publication list (Markdown)
research_intro: >-
  During my Ph.D., I evaluated large language models (LLMs) and pointed out their brittleness when learning abstract representations.
  I showed that inducing LLMs to behave as causal models can improve the learning of robust and domain-invariant mechanisms.
  I also worked on extracting causal structures from natural language with LLM agents and harnessing these structures to make the model reason more causally from less information.
  At LawZero, I build on this to create models that can make predictions about the world without pursuing goals of their own.

# Community contributions shown below the publication list (Markdown)
contributions: >-
  I also contributed causal inference questions to the [Humanity's Last Exam](https://lastexam.ai/) benchmark,
  published in [Nature](https://www.nature.com/articles/s41586-025-09962-4) (2026),
  and abstract reasoning tasks to [OpenAI's Evals](https://github.com/openai/evals).

