# Bio Information
short_bio: |-
  I am Gaël *(pron. [gah-el])*, senior machine learning research scientist at [LawZero](https://lawzero.org/en/research), an AI safety nonprofit organization created by Yoshua Bengio and incubated at Mila - Quebec AI Institute.
  I work on building safer frontier models by disentangling predictive capability from agency. My interests include pre-training alignment, prospective monitoring, world modelling and scalable oversight.
  <br>
  <br>
  Before joining LawZero, I completed my PhD at the University of Auckland on deep causal modelling for reasoning and generalization.
  During my PhD, I conducted the [first evaluation of large language models (LLMs) on abstract reasoning](/projects/abstract-reasoning), highlighting their brittleness and limitations,
  and developed [ICLM](/projects/iclm), a novel modular language model architecture based on causal principles for out-of-distribution reasoning.
  I also built the [Causal Cartographer](/projects/causal-cartographer), an end-to-end framework for causal extraction and inference with LLM agents, enabling them to reason more reliably and efficiently in counterfactual environments (decreasing inference cost by up to 70%).
  My work received the University of Auckland Best Student Published Paper in Computer Science award in 2023.

# Research focus
research_focus: >-
  I work on building safe and trustworthy AI systems. At LawZero, my research focuses on disentangling predictive capability from agency, Bayesian reasoning, pre-training alignment via contextualization, world modelling and scalable oversight.
  My background is in causal reasoning, which I see as crucial for creating safe and reliable frontier models able to build accurate representations of the world.

